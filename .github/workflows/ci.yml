name: Crafleet verification

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: verification-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
    compatibility:
        name: Node.js ${{ matrix.node }}
        strategy:
            fail-fast: false
            matrix:
                node: ["24.20.0", "25.9.0", "26.8.1"]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            CI: "true"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node }}
                  package-manager-cache: false
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  version: 11.24.0
                  cache: true
            - run: pnpm install --frozen-lockfile
            - run: pnpm verify

    servers:
        name: Real servers (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        env:
            CI: "true"
            # Set this repository variable to "true" only after explicitly
            # accepting https://www.minecraft.net/eula for test servers.
            # An unset value fails Paper E2E; it is never silently skipped.
            CRAFLEET_E2E_EULA: ${{ vars.CRAFLEET_E2E_EULA }}
            CRAFLEET_TEST_RESTIC: "1"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  package-manager-cache: false
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  version: 11.24.0
                  cache: true
            - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
              with:
                  distribution: temurin
                  java-version: "25.0.3+9.0.LTS"
            - run: pnpm install --frozen-lockfile
            - name: Cross-platform filesystem, process, and console integration tests
              run: pnpm test:integration
            - run: pnpm build
            - name: Verify the distributable package
              run: pnpm test:package
            - name: Select the verified package for real server tests
              run: >-
                  node -e "const fs=require('node:fs'),v=require('./packages/cli/package.json').version;
                  fs.appendFileSync(process.env.GITHUB_ENV,'CRAFLEET_E2E_PACKAGE=artifacts/crafleet-'+v+'.tgz\n')"
            - name: Build locked real server and plugin fixtures
              run: node tests/fixtures/build.mjs --with-servers --verify-reproducible
            - name: Real Paper and Velocity E2E using the verified tarball
              run: pnpm test:e2e
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: failure()
              with:
                  name: diagnostics-${{ matrix.os }}
                  path: |
                      coverage/
                      .test-tmp/**/diagnostics/
                  if-no-files-found: warn
                  include-hidden-files: true
                  retention-days: 7

    databases:
        name: Real database (${{ matrix.kind }})
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - kind: mysql
                      image: mysql:26.7.0@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345
                      health: mysqladmin ping -h 127.0.0.1 --user=root --password=crafleet-disposable-ci-password --silent
                    - kind: mariadb
                      image: mariadb:12.3.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
                      health: mariadb-admin ping -h 127.0.0.1 --user=root --password=crafleet-disposable-ci-password --silent
        services:
            database:
                image: ${{ matrix.image }}
                env:
                    MYSQL_ROOT_PASSWORD: crafleet-disposable-ci-password
                    MYSQL_DATABASE: crafleet_test_service
                    MARIADB_ROOT_PASSWORD: crafleet-disposable-ci-password
                    MARIADB_DATABASE: crafleet_test_service
                options: >-
                    --health-cmd="${{ matrix.health }}"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=30
        env:
            CI: "true"
            CRAFLEET_TEST_DATABASE_KIND: ${{ matrix.kind }}
            CRAFLEET_TEST_DATABASE_NAME: crafleet_test_service
            CRAFLEET_TEST_DATABASE_USER: root
            CRAFLEET_TEST_DATABASE_PASSWORD: crafleet-disposable-ci-password
            CRAFLEET_TEST_DATABASE_PORT: "3306"
            CRAFLEET_TEST_DATABASE_DUMP_COMMAND: ${{ github.workspace }}/tests/support/database-dump.mjs
            CRAFLEET_TEST_DATABASE_CLIENT_COMMAND: ${{ github.workspace }}/tests/support/database-client.mjs
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  package-manager-cache: false
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  version: 11.24.0
                  cache: true
            - run: pnpm install --frozen-lockfile
            - run: chmod +x tests/support/database-dump.mjs tests/support/database-client.mjs
            - name: Dump and restore actual data using the matching server clients
              env:
                  CRAFLEET_TEST_DATABASE_CONTAINER: ${{ job.services.database.id }}
              run: pnpm exec vitest run --project integration tests/integration/backup-database-service.test.ts

    required:
        name: All supported environments
        if: always()
        needs: [compatibility, servers, databases]
        runs-on: ubuntu-latest
        steps:
            - name: Require every supported environment to succeed
              env:
                  COMPATIBILITY: ${{ needs.compatibility.result }}
                  SERVERS: ${{ needs.servers.result }}
                  DATABASES: ${{ needs.databases.result }}
              run: >-
                  test "$COMPATIBILITY" = success &&
                  test "$SERVERS" = success &&
                  test "$DATABASES" = success

    publish:
        name: Publish npm package
        if: >-
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v') &&
            github.ref_protected == true &&
            vars.CRAFLEET_NPM_TRUSTED_PUBLISHING == 'true'
        needs: [required]
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  package-manager-cache: false
                  registry-url: https://registry.npmjs.org
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  version: 11.24.0
                  cache: false
            - run: pnpm install --frozen-lockfile
            - name: Load the authorized release key
              shell: bash
              run: |
                  expected='3C7F5488B337C1D85A8620122162A8E62C120348'
                  gnupg_home="$RUNNER_TEMP/crafleet-release-gnupg"
                  install -d -m 700 "$gnupg_home"
                  export GNUPGHOME="$gnupg_home"
                  echo "GNUPGHOME=$gnupg_home" >> "$GITHUB_ENV"
                  primary="$(gpg --batch --with-colons --import-options show-only --import .github/keys/release-signing-key.asc 2>/dev/null | awk -F: '$1 == "pub" { wanted=1; next } wanted && $1 == "fpr" { print $10; wanted=0 }')"
                  test "$primary" = "$expected"
                  gpg --batch --import-options import-minimal --import .github/keys/release-signing-key.asc
            - name: Prepare the exact release tarball
              run: pnpm release:prepare
            - name: Publish with npm trusted publishing and provenance
              run: pnpm release:publish

    github-release:
        name: Create GitHub release
        needs: [publish]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Create release from the verified tag
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >-
                  gh release create "$GITHUB_REF_NAME"
                  --repo "$GITHUB_REPOSITORY"
                  --verify-tag
                  --generate-notes
                  --title "$GITHUB_REF_NAME"
